name: Deploy UK AQ Media

on:
  push:
    branches:
      - main
    paths:
      - apps/**
      - packages/**
      - migrations/**
      - config/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - .github/workflows/uk_aq_media_deploy.yml
  workflow_dispatch:

permissions:
  contents: read

# Shared with email deployment: serialize D1 migrations and Queue creation.
concurrency:
  group: uk-aq-media-deploy
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: Check and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.UK_AQ_MEDIA_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.UK_AQ_MEDIA_CFLARE_API_TOKEN }}
      UK_AQ_MEDIA_CFLARE_D1DB_ID: ${{ vars.UK_AQ_MEDIA_CFLARE_D1DB_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Verify Cloudflare configuration and required secrets
        env:
          UK_AQ_MEDIA_ADMIN_TOKEN: ${{ secrets.UK_AQ_MEDIA_ADMIN_TOKEN }}
          UK_AQ_MEDIA_WORKER_HTTP_SECRET: ${{ secrets.UK_AQ_MEDIA_WORKER_HTTP_SECRET }}
          UK_AQ_MEDIA_GDELT_INGEST_SECRET: ${{ secrets.UK_AQ_MEDIA_GDELT_INGEST_SECRET }}
          UK_AQ_MEDIA_BLUESKY_APP_PSWD: ${{ secrets.UK_AQ_MEDIA_BLUESKY_APP_PSWD }}
          UK_AQ_MEDIA_FACEBOOK_PAGE_TOKEN: ${{ secrets.UK_AQ_MEDIA_FACEBOOK_PAGE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing repository variable UK_AQ_MEDIA_CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing repository secret UK_AQ_MEDIA_CFLARE_API_TOKEN"; exit 1; }
          test -n "$UK_AQ_MEDIA_ADMIN_TOKEN" || { echo "::error::Missing repository secret UK_AQ_MEDIA_ADMIN_TOKEN"; exit 1; }
          test -n "$UK_AQ_MEDIA_CFLARE_D1DB_ID" || { echo "::error::Missing repository variable UK_AQ_MEDIA_CFLARE_D1DB_ID"; exit 1; }
          test -n "$UK_AQ_MEDIA_WORKER_HTTP_SECRET" || { echo "::error::Missing repository secret UK_AQ_MEDIA_WORKER_HTTP_SECRET"; exit 1; }
          test -n "$UK_AQ_MEDIA_GDELT_INGEST_SECRET" || { echo "::error::Missing repository secret UK_AQ_MEDIA_GDELT_INGEST_SECRET"; exit 1; }
          test -n "$UK_AQ_MEDIA_BLUESKY_APP_PSWD" || { echo "::error::Missing repository secret UK_AQ_MEDIA_BLUESKY_APP_PSWD"; exit 1; }
          test -n "$UK_AQ_MEDIA_FACEBOOK_PAGE_TOKEN" || { echo "::error::Missing repository secret UK_AQ_MEDIA_FACEBOOK_PAGE_TOKEN"; exit 1; }

      - name: Render account-specific Wrangler bindings
        run: node scripts/render-wrangler-config.mjs core

      - name: Verify D1 belongs to the selected Cloudflare account
        run: node scripts/verify-media-d1.mjs

      - name: Ensure News email Queue exists before producer deployment
        run: |
          set -euo pipefail
          if npx wrangler queues info uk-aq-media-email >/dev/null 2>&1; then
            echo "Queue uk-aq-media-email already exists."
          else
            if ! npx wrangler queues create uk-aq-media-email; then
              # Recheck Queue existence if creation reports a conflict.
              npx wrangler queues info uk-aq-media-email >/dev/null
            fi
          fi
          npx wrangler queues info uk-aq-media-email >/dev/null

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply MEDIA_DB --remote --config apps/media-discovery/wrangler.jsonc

      - name: Deploy public Worker
        run: npx wrangler deploy --config apps/media-public/wrangler.jsonc

      - name: Apply admin Worker secret
        env:
          UK_AQ_MEDIA_ADMIN_TOKEN: ${{ secrets.UK_AQ_MEDIA_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          node -e 'process.stdout.write(JSON.stringify({UK_AQ_MEDIA_ADMIN_TOKEN: process.env.UK_AQ_MEDIA_ADMIN_TOKEN}))' |
            npx wrangler secret bulk --config apps/media-admin/wrangler.jsonc --name uk-aq-media-admin

      - name: Deploy admin Worker
        run: npx wrangler deploy --config apps/media-admin/wrangler.jsonc

      - name: Apply discovery Worker secret
        env:
          UK_AQ_MEDIA_WORKER_HTTP_SECRET: ${{ secrets.UK_AQ_MEDIA_WORKER_HTTP_SECRET }}
          UK_AQ_MEDIA_GDELT_INGEST_SECRET: ${{ secrets.UK_AQ_MEDIA_GDELT_INGEST_SECRET }}
          UK_AQ_MEDIA_BLUESKY_APP_PSWD: ${{ secrets.UK_AQ_MEDIA_BLUESKY_APP_PSWD }}
          UK_AQ_MEDIA_FACEBOOK_PAGE_TOKEN: ${{ secrets.UK_AQ_MEDIA_FACEBOOK_PAGE_TOKEN }}
        run: |
          set -euo pipefail
          secrets_json="$(jq -n \
            --arg UK_AQ_MEDIA_WORKER_HTTP_SECRET "${UK_AQ_MEDIA_WORKER_HTTP_SECRET}" \
            --arg UK_AQ_MEDIA_GDELT_INGEST_SECRET "${UK_AQ_MEDIA_GDELT_INGEST_SECRET}" \
            --arg UK_AQ_MEDIA_BLUESKY_APP_PSWD "${UK_AQ_MEDIA_BLUESKY_APP_PSWD}" \
            --arg UK_AQ_MEDIA_FACEBOOK_PAGE_TOKEN "${UK_AQ_MEDIA_FACEBOOK_PAGE_TOKEN}" \
            '{UK_AQ_MEDIA_WORKER_HTTP_SECRET: $UK_AQ_MEDIA_WORKER_HTTP_SECRET,
              UK_AQ_MEDIA_GDELT_INGEST_SECRET: $UK_AQ_MEDIA_GDELT_INGEST_SECRET,
              UK_AQ_MEDIA_BLUESKY_APP_PSWD: $UK_AQ_MEDIA_BLUESKY_APP_PSWD,
              UK_AQ_MEDIA_FACEBOOK_PAGE_TOKEN: $UK_AQ_MEDIA_FACEBOOK_PAGE_TOKEN}')"
          unset UK_AQ_MEDIA_WORKER_HTTP_SECRET
          unset UK_AQ_MEDIA_GDELT_INGEST_SECRET
          unset UK_AQ_MEDIA_BLUESKY_APP_PSWD
          unset UK_AQ_MEDIA_FACEBOOK_PAGE_TOKEN
          for attempt in 1 2 3; do
            if printf '%s' "$secrets_json" | npx wrangler secret bulk \
              --config apps/media-discovery/wrangler.jsonc \
              --name uk-aq-media-discovery; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to apply media-discovery Worker secret after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Deploy discovery Worker
        run: npx wrangler deploy --config apps/media-discovery/wrangler.jsonc
