name: Deploy UK AQ News email (manual only)
on:
  workflow_dispatch:
    inputs:
      allow_enabled_email_delivery:
        description: "Explicitly permit deployment with News email sending enabled"
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: uk-aq-media-email-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.UK_AQ_MEDIA_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.UK_AQ_MEDIA_CFLARE_API_TOKEN }}
      UK_AQ_MEDIA_CFLARE_D1DB_ID: ${{ vars.UK_AQ_MEDIA_CFLARE_D1DB_ID }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      NEWS_EMAIL_ENABLED: ${{ vars.NEWS_EMAIL_ENABLED }}
      NEWS_EMAIL_SITE_ORIGIN: ${{ vars.NEWS_EMAIL_SITE_ORIGIN }}
      NEWS_EMAIL_TURNSTILE_HOSTNAMES: ${{ vars.NEWS_EMAIL_TURNSTILE_HOSTNAMES }}
      NEWS_EMAIL_PUBLIC_API_ORIGIN: ${{ vars.NEWS_EMAIL_PUBLIC_API_ORIGIN }}
      UK_AQ_MEDIA_PUBLIC_URL: ${{ vars.UK_AQ_MEDIA_PUBLIC_URL }}
      ALLOW_ENABLED_EMAIL_DELIVERY: ${{ inputs.allow_enabled_email_delivery || false }}
    steps:
      - name: Verify TEST email isolation and activation intent
        run: |
          node --input-type=module <<'JS'
          const env = process.env;
          if (env.NEWS_EMAIL_ENABLED === 'true' && env.ALLOW_ENABLED_EMAIL_DELIVERY !== 'true') {
            throw new Error('Enabled News email deployment requires explicit manual opt-in');
          }
          if (env.GITHUB_REPOSITORY === 'TEST-uk-aq/uk-aq-media') {
            const expected = {
              CLOUDFLARE_ACCOUNT_ID: 'db4d01d350f4acdbaa8c6a692f721620',
              UK_AQ_MEDIA_CFLARE_D1DB_ID: '71318b8b-e4f2-469c-908a-48e65b482126',
              SUPABASE_URL: 'https://zztjgmdiftqtdcrlfpvc.supabase.co',
              NEWS_EMAIL_SITE_ORIGIN: 'https://test-uk-aq.ukaq.co.uk',
              NEWS_EMAIL_PUBLIC_API_ORIGIN: 'https://uk-aq-media-email.test-uk-aq-media.workers.dev',
              UK_AQ_MEDIA_PUBLIC_URL: 'https://uk-aq-media-public.test-uk-aq-media.workers.dev',
            };
            for (const [key, value] of Object.entries(expected)) {
              if (env[key] !== value) throw new Error(`TEST email isolation mismatch: ${key}`);
            }
          }
          JS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run build
      # Provision the shared Supabase subscription schema and Google SMTP OAuth
      # before running this manual deployment. Pro/Tunnel remains optional.
      - name: Render account-specific Wrangler and email settings
        run: node scripts/render-wrangler-config.mjs email

      - name: Verify D1 belongs to the selected Cloudflare account
        run: node scripts/verify-media-d1.mjs
      - name: Ensure News email Queue exists before Worker deployment
        run: |
          set -euo pipefail
          if npx wrangler queues info uk-aq-media-email >/dev/null 2>&1; then
            echo "Queue uk-aq-media-email already exists."
          else
            if ! npx wrangler queues create uk-aq-media-email; then
              # The ordinary Media workflow may have created it after our first check.
              npx wrangler queues info uk-aq-media-email >/dev/null
            fi
          fi
          npx wrangler queues info uk-aq-media-email >/dev/null
      - name: Apply Media D1 migration
        run: npx wrangler d1 migrations apply MEDIA_DB --remote --config apps/media-email/wrangler.jsonc
      - name: Apply News email Worker secrets
        env:
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
          NEWS_EMAIL_TURNSTILE_SECRET: ${{ secrets.NEWS_EMAIL_TURNSTILE_SECRET }}
          NEWS_EMAIL_TOKEN_SECRET: ${{ secrets.NEWS_EMAIL_TOKEN_SECRET }}
          NEWS_EMAIL_RATE_SECRET: ${{ secrets.NEWS_EMAIL_RATE_SECRET }}
          UK_AQ_MEDIA_EMAIL_WORKER_HTTP_SECRET: ${{ secrets.UK_AQ_MEDIA_EMAIL_WORKER_HTTP_SECRET }}
          NEWS_EMAIL_OPERATOR_SECRET: ${{ secrets.NEWS_EMAIL_OPERATOR_SECRET }}
          GOOGLE_SMTP_USERNAME: ${{ secrets.GOOGLE_SMTP_USERNAME }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          # Optional pair; no Pro hostname/secret is needed for primary deployment.
          NEWS_EMAIL_SENDER_URL: ${{ secrets.NEWS_EMAIL_SENDER_URL }}
          NEWS_EMAIL_SENDER_SECRET: ${{ secrets.NEWS_EMAIL_SENDER_SECRET }}
        run: |
          node --input-type=module <<'JS' | npx wrangler secret bulk --config apps/media-email/wrangler.jsonc
          const keys = ['SB_SECRET_KEY', 'NEWS_EMAIL_TURNSTILE_SECRET', 'NEWS_EMAIL_TOKEN_SECRET',
            'NEWS_EMAIL_RATE_SECRET', 'UK_AQ_MEDIA_EMAIL_WORKER_HTTP_SECRET',
            'NEWS_EMAIL_OPERATOR_SECRET', 'GOOGLE_SMTP_USERNAME', 'GOOGLE_OAUTH_CLIENT_ID',
            'GOOGLE_OAUTH_CLIENT_SECRET', 'GOOGLE_OAUTH_REFRESH_TOKEN'];
          if (keys.some(key => !process.env[key])) throw new Error('Missing required News email secret');
          const fallback = ['NEWS_EMAIL_SENDER_URL', 'NEWS_EMAIL_SENDER_SECRET'];
          const configured = fallback.filter(key => Boolean(process.env[key]));
          if (configured.length === 1) throw new Error('Incomplete optional Pro fallback configuration');
          if (configured.length === 2) {
            let url;
            try { url = new URL(process.env.NEWS_EMAIL_SENDER_URL); }
            catch { throw new Error('Invalid optional Pro fallback configuration'); }
            if (url.protocol !== 'https:' || url.pathname !== '/send' || url.username || url.password || url.search || url.hash ||
                process.env.NEWS_EMAIL_SENDER_SECRET.length < 32) throw new Error('Invalid optional Pro fallback configuration');
            keys.push(...fallback);
          }
          process.stdout.write(JSON.stringify(Object.fromEntries(keys.map(key => [key, process.env[key]]))));
          JS
      - name: Remove optional Pro fallback secrets when deliberately absent
        env:
          NEWS_EMAIL_SENDER_URL: ${{ secrets.NEWS_EMAIL_SENDER_URL }}
          NEWS_EMAIL_SENDER_SECRET: ${{ secrets.NEWS_EMAIL_SENDER_SECRET }}
        run: |
          set -euo pipefail
          if [ -n "$NEWS_EMAIL_SENDER_URL" ] || [ -n "$NEWS_EMAIL_SENDER_SECRET" ]; then
            test -n "$NEWS_EMAIL_SENDER_URL" && test -n "$NEWS_EMAIL_SENDER_SECRET"
            exit 0
          fi
          secret_names="$(npx wrangler secret list --config apps/media-email/wrangler.jsonc --format json)"
          for key in NEWS_EMAIL_SENDER_URL NEWS_EMAIL_SENDER_SECRET; do
            if printf '%s' "$secret_names" | jq -e --arg key "$key" '.[] | select(.name == $key)' >/dev/null; then
              npx wrangler secret delete "$key" --config apps/media-email/wrangler.jsonc
            fi
          done
      - name: Deploy email Worker
        run: npx wrangler deploy --config apps/media-email/wrangler.jsonc
