name: Deploy UK AQ News email (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uk-aq-media-email-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.UK_AQ_MEDIA_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.UK_AQ_MEDIA_CFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run build
      # Operator first applies the shared Supabase schema, creates the Queue,
      # configures the Pro/Tunnel and replaces the non-secret Wrangler placeholders.
      - name: Require completed configuration
        run: |
          if grep -q 'REPLACE_' apps/media-email/wrangler.jsonc; then
            echo 'Complete the News email configuration before deployment.'
            exit 1
          fi
      - name: Apply Media D1 migration
        run: npx wrangler d1 migrations apply MEDIA_DB --remote --config apps/media-email/wrangler.jsonc
      - name: Apply News email Worker secrets
        env:
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
          NEWS_EMAIL_TURNSTILE_SECRET: ${{ secrets.NEWS_EMAIL_TURNSTILE_SECRET }}
          NEWS_EMAIL_TOKEN_SECRET: ${{ secrets.NEWS_EMAIL_TOKEN_SECRET }}
          NEWS_EMAIL_RATE_SECRET: ${{ secrets.NEWS_EMAIL_RATE_SECRET }}
          UK_AQ_MEDIA_EMAIL_WORKER_HTTP_SECRET: ${{ secrets.UK_AQ_MEDIA_EMAIL_WORKER_HTTP_SECRET }}
          NEWS_EMAIL_SENDER_SECRET: ${{ secrets.NEWS_EMAIL_SENDER_SECRET }}
          NEWS_EMAIL_OPERATOR_SECRET: ${{ secrets.NEWS_EMAIL_OPERATOR_SECRET }}
        run: |
          node --input-type=module <<'JS' | npx wrangler secret bulk --config apps/media-email/wrangler.jsonc
          const keys = ['SB_SECRET_KEY', 'NEWS_EMAIL_TURNSTILE_SECRET', 'NEWS_EMAIL_TOKEN_SECRET',
            'NEWS_EMAIL_RATE_SECRET', 'UK_AQ_MEDIA_EMAIL_WORKER_HTTP_SECRET',
            'NEWS_EMAIL_SENDER_SECRET', 'NEWS_EMAIL_OPERATOR_SECRET'];
          if (keys.some(key => !process.env[key])) throw new Error('Missing required News email secret');
          process.stdout.write(JSON.stringify(Object.fromEntries(keys.map(key => [key, process.env[key]]))));
          JS
      - name: Deploy email Worker
        run: npx wrangler deploy --config apps/media-email/wrangler.jsonc
